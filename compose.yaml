services:
  web:
    # CI(.github/workflows/docker.yml)在推送 v* 标签时自动构建并推送到 GHCR 的镜像。
    # 标签策略:0.1.0(精确版本)/ 0.1(次版本浮动)/ latest(最新稳定版)。
    # NAS 部署建议使用 latest;需要固定回滚版本时改为具体版本号,如 :0.1.0
    # ghcr.nju.edu.cn/mazaiguo/chinatextbookstudyfree:latest
    # ghcr.io/mazaiguo/chinatextbookstudyfree:latest
    image: ghcr.nju.edu.cn/mazaiguo/chinatextbookstudyfree:latest

    # ---- 本地构建(可选)----
    # 在 NAS/本地有完整源码、且不想从 GHCR 拉取时,取消下方注释即可从 Dockerfile 构建。
    # 注意:构建阶段会下载教学资源与 MP3 音频(需访问 github.com),耗时约 10–30 分钟,
    # 需要 NAS 有足够内存(建议 ≥2GB 空闲)与磁盘空间(建议 ≥5GB)。
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   target: production                    # 默认阶段:完整构建(资源校验 + 静态站点)
    #   args:
    #     ASSETS_RELEASE: v1.2.0-assets       # 教学资源 Release 版本,可用 .env 覆盖

    # 容器名称:便于在 fnOS 容器列表中识别,也方便 docker exec/logs 调试
    container_name: china-textbook-study-free

    # 架构说明:CI 目前仅构建 linux/amd64 镜像。
    # Intel/AMD 小主机 NAS(飞牛主流机型)可直接使用;
    # 若为 ARM 架构 NAS,需先在 x86 机器上用 buildx --platform linux/arm64 交叉构建并推送。
    platform: linux/amd64

    # 端口映射:"主机IP:主机端口:容器端口"。镜像内 nginx 固定监听 8080(见 docker/nginx.conf,不可改),
    # 冒号左侧的主机端口可改,默认 5010。默认 0.0.0.0:监听所有网卡,局域网及 cloudflared 容器
    # (隧道指向 http://NAS内网IP:5010)均可访问;仅允许 NAS 本机访问时改回 127.0.0.1。
    # 飞牛 fnOS 管理面板默认占用 5666,5010 通常无冲突;如有冲突可改为 8090、9080 等。
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-5010}:8080"

    # 开机自启:容器随 Docker 守护进程自动拉起,异常退出自动重启,fnOS 重启后服务自动恢复
    restart: unless-stopped

    # 健康检查:容器内 nginx 监听 8080(与 Dockerfile 内置 HEALTHCHECK 一致),
    # 此处显式声明便于 fnOS 界面显示健康状态。
    # 每 30 秒探测一次,失败 3 次后标记 unhealthy(fnOS「容器」页面可见)
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    # 日志限制:静态站点日志主要来自 nginx 访问日志,限制体积防止占满 NAS 磁盘
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # ---- 资源限制(可选,按 NAS 实际情况调整或取消注释)----
    # 本站点为纯静态服务(nginx + 已构建产物),内存占用很低(约 20–50MB)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "0.50"        # 最多使用半核
    #       memory: 256M        # 最多使用 256MB 内存

    # ---- 数据挂载(可选)----
    # 镜像内站点为只读构建产物,常规部署无需挂载卷。
    # 如需自定义站点内容(例如本地重新构建的静态目录),可启用下方挂载,
    # 将宿主机目录覆盖到 nginx 站点根目录:
    # volumes:
    #   - ./output:/usr/share/nginx/html:ro   # 例:挂载仓库内 output 静态资源目录
    #
    # 或使用「快速打包已有站点」方式:先在本地 npm run build 生成 apps/web/out,
    # 再用 docker build --target prebuilt --build-context site=./apps/web/out . 打包

    # 独立网络,避免与其他 Compose 项目容器名/端口冲突。
    # 网络固定命名为 cstf(compose 不再加项目名前缀),便于外部容器接入,例如 cloudflared:
    #   docker network connect cstf <cloudflared容器名>
    # 接入后 Cloudflare 隧道 Service URL 填 http://china-textbook-study-free:8080,
    # 容器间直连,无需经过主机端口。
    networks:
      - cstf

networks:
  cstf:
    driver: bridge
    name: cstf
